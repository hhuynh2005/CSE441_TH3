<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ứng dụng luyện phát âm tiếng Anh AI và theo dõi kỷ luật học tập - Bài tập thực hành 3 (TH3) Nhóm 16">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SpeakUp AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts for Material Icons and Noto Sans IPA Support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">

  <title>SpeakUp AI - TH3 Nhóm 16</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // ==============================================================================
    // 1. PHÁT ÂM THANH MẪU CHUẨN BẢN XỨ (CDN HUMAN AUDIO & TTS FALLBACK)
    // ==============================================================================
    window.speakWord = function(text, lang) {
      if (!text) return;
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.resume();
        }

        const accentType = (lang === 'UK') ? '1' : '2';
        const cdnUrl = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=' + accentType;
        const audio = new Audio(cdnUrl);
        
        let played = false;
        const playFallback = function() {
          if (played) return;
          played = true;
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
              window.speechSynthesis.resume();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = (lang === 'UK') ? 'en-GB' : 'en-US';
              utterance.rate = 0.85;
              utterance.pitch = 1.0;
              window.speechSynthesis.speak(utterance);
              console.log('🔊 Fallback Web Speech Synthesis:', text);
            } catch(e) {
              console.warn('TTS error:', e);
            }
          }
        };

        audio.onended = function() { played = true; };
        audio.onerror = function(err) {
          console.warn('CDN audio error, switching to TTS:', err);
          playFallback();
        };

        const timer = setTimeout(function() {
          if (!played) playFallback();
        }, 1500);

        const p = audio.play();
        if (p !== undefined) {
          p.then(function() {
            clearTimeout(timer);
            played = true;
            console.log('✅ CDN Audio phát thành công:', text, 'Acc:', lang);
          }).catch(function(err) {
            clearTimeout(timer);
            playFallback();
          });
        }
      } catch (e) {
        console.error('Lỗi khi phát âm từ mẫu:', e);
      }
    };

    // ==============================================================================
    // 2. THU ÂM VÀ NHẬN DIỆN GIỌNG NÓI THỰC TẾ (WEB SPEECH RECOGNITION & MEDIARECORDER)
    // ==============================================================================
    let mediaStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let recordedAudioUrl = null;
    let currentPlaybackAudio = null;
    let currentMimeType = '';

    let recognition = null;
    window.lastRecognizedText = '';
    window.lastConfidence = 0.0;
    window.isSpeechRecActive = false;

    // Khởi tạo Web Speech Recognition (Google Speech Engine tích hợp sẵn trong Chrome/Edge)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 3;

      recognition.onresult = function(event) {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const res = event.results[i];
          if (res.isFinal || res[0].confidence > 0.3) {
            window.lastRecognizedText = res[0].transcript.trim().toLowerCase();
            window.lastConfidence = res[0].confidence || 0.92;
            console.log('🎤 Web STT Recognized:', window.lastRecognizedText, 'Conf:', window.lastConfidence);
          }
        }
      };

      recognition.onerror = function(event) {
        console.warn('Speech recognition warning/error:', event.error);
        window.isSpeechRecActive = false;
      };

      recognition.onend = function() {
        window.isSpeechRecActive = false;
      };
    }

    window.startWebRecording = async function(lang) {
      window.lastRecognizedText = '';
      window.lastConfidence = 0.0;
      audioChunks = [];
      if (currentPlaybackAudio) {
        currentPlaybackAudio.pause();
        currentPlaybackAudio = null;
      }
      if (recordedAudioUrl) {
        URL.revokeObjectURL(recordedAudioUrl);
        recordedAudioUrl = null;
      }

      // Khởi động nhận diện giọng nói STT
      if (recognition) {
        try {
          recognition.lang = (lang === 'UK') ? 'en-GB' : 'en-US';
          recognition.start();
          window.isSpeechRecActive = true;
          console.log('🎤 STT engine started in:', recognition.lang);
        } catch (e) {
          console.warn('Recognition start skipped (already running):', e);
        }
      }

      // Khởi động thu âm tệp âm thanh thực tế từ Micro
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn('Trình duyệt không hỗ trợ getUserMedia');
          return;
        }
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        currentMimeType = '';
        if (typeof MediaRecorder.isTypeSupported === 'function') {
          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            currentMimeType = 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/webm')) {
            currentMimeType = 'audio/webm';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            currentMimeType = 'audio/mp4';
          }
        }
        
        const options = currentMimeType ? { mimeType: currentMimeType } : undefined;
        mediaRecorder = new MediaRecorder(mediaStream, options);
        
        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };
        
        mediaRecorder.onstop = function() {
          try {
            if (audioChunks.length > 0) {
              const blobType = currentMimeType || 'audio/webm';
              audioBlob = new Blob(audioChunks, { type: blobType });
              recordedAudioUrl = URL.createObjectURL(audioBlob);
              console.log('✅ Đã lưu tệp giọng nói học viên:', audioBlob.size, 'bytes, URL:', recordedAudioUrl);
            }
          } catch(e) {
            console.error('Lỗi tạo audio blob:', e);
          }
          if (mediaStream) {
            mediaStream.getTracks().forEach(function(track) {
              track.stop();
            });
            mediaStream = null;
          }
        };

        // Ghi nhận khối dữ liệu mỗi 100ms
        mediaRecorder.start(100);
        console.log('🎤 MediaRecorder đang thu âm từ Micro...');
      } catch (err) {
        console.warn('Chưa cấp quyền Microphone hoặc không tìm thấy thiết bị thu:', err);
      }
    };

    window.stopWebRecording = function() {
      if (recognition && window.isSpeechRecActive) {
        try {
          recognition.stop();
        } catch (e) {}
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          if (typeof mediaRecorder.requestData === 'function') {
            mediaRecorder.requestData();
          }
          mediaRecorder.stop();
          console.log('🛑 Đã dừng thu âm');
        } catch (e) {
          console.error('Lỗi khi dừng thu âm:', e);
        }
      }
    };

    window.playRecordedAudio = function() {
      try {
        if (currentPlaybackAudio) {
          currentPlaybackAudio.pause();
          currentPlaybackAudio = null;
        }
        if (recordedAudioUrl) {
          currentPlaybackAudio = new Audio(recordedAudioUrl);
          currentPlaybackAudio.play().then(function() {
            console.log('▶️ Đang phát lại giọng nói của bạn qua loa');
          }).catch(function(err) {
            console.error('Lỗi khi phát lại giọng:', err);
          });
        } else {
          console.warn('Chưa có tệp thu âm hợp lệ.');
        }
      } catch (e) {
        console.error('Lỗi phát âm thanh:', e);
      }
    };

    window.stopRecordedAudio = function() {
      if (currentPlaybackAudio) {
        currentPlaybackAudio.pause();
        currentPlaybackAudio = null;
      }
    };

    window.hasRecordedAudio = function() {
      return (recordedAudioUrl !== null && audioChunks.length > 0);
    };

    window.clearLastRecognized = function() {
      window.lastRecognizedText = '';
      window.lastConfidence = 0.0;
    };

    window.getLastRecognizedText = function() {
      return window.lastRecognizedText || '';
    };

    window.getLastConfidence = function() {
      return window.lastConfidence || 0.0;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
