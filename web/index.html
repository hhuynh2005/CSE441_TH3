<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ứng dụng luyện phát âm tiếng Anh AI và theo dõi kỷ luật học tập - Bài tập thực hành 3 (TH3) Nhóm 16">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SpeakUp AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts for Material Icons and Noto Sans IPA Support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">

  <title>SpeakUp AI - TH3 Nhóm 16</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 1. Phát âm thanh mẫu chuẩn người bản xứ (Web Speech Synthesis - TTS)
    window.speakWord = function(text, lang) {
      if (!('speechSynthesis' in window)) {
        console.warn('Trình duyệt không hỗ trợ Web Speech Synthesis API');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = (lang === 'UK') ? 'en-GB' : 'en-US';
        utterance.rate = 0.85; // Tốc độ chuẩn cho học viên luyện nghe
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.error('Lỗi khi phát âm từ mẫu:', e);
      }
    };

    // 2. Thu âm trực tiếp từ Microphone qua Web MediaRecorder & Phát lại
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let currentPlaybackAudio = null;

    window.startWebRecording = async function() {
      audioChunks = [];
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn('Trình duyệt không hỗ trợ truy cập Microphone');
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };
        mediaRecorder.onstop = function() {
          audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          if (currentPlaybackAudio) {
            currentPlaybackAudio.pause();
            currentPlaybackAudio = null;
          }
        };
        mediaRecorder.start();
      } catch (err) {
        console.warn('Chưa cấp quyền Microphone hoặc không tìm thấy thiết bị thu:', err);
      }
    };

    window.stopWebRecording = function() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          mediaRecorder.stop();
          mediaRecorder.stream.getTracks().forEach(function(track) {
            track.stop();
          });
        } catch (e) {
          console.error('Lỗi khi dừng thu âm:', e);
        }
      }
    };

    window.playRecordedAudio = function() {
      if (!audioBlob) {
        console.warn('Chưa có file thu âm để phát lại');
        return;
      }
      try {
        if (currentPlaybackAudio) {
          currentPlaybackAudio.pause();
        }
        const audioUrl = URL.createObjectURL(audioBlob);
        currentPlaybackAudio = new Audio(audioUrl);
        currentPlaybackAudio.play();
      } catch (e) {
        console.error('Lỗi khi phát lại giọng thu:', e);
      }
    };

    window.stopRecordedAudio = function() {
      if (currentPlaybackAudio) {
        currentPlaybackAudio.pause();
        currentPlaybackAudio = null;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
