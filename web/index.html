<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ứng dụng luyện phát âm tiếng Anh AI và theo dõi kỷ luật học tập - Bài tập thực hành 3 (TH3) Nhóm 16">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SpeakUp AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts for Material Icons and Noto Sans IPA Support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">

  <title>SpeakUp AI - TH3 Nhóm 16</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // ==============================================================================
    // 0. BỘ TẠO ÂM THANH HIỆU ỨNG (WEB AUDIO API CHIME GENERATOR)
    // ==============================================================================
    let globalAudioCtx = null;
    window.playChime = function(freq, duration) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!globalAudioCtx) {
          globalAudioCtx = new AudioContext();
        }
        if (globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }
        const osc = globalAudioCtx.createOscillator();
        const gain = globalAudioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq || 520, globalAudioCtx.currentTime);
        const dur = duration || 0.12;
        gain.gain.setValueAtTime(0.18, globalAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, globalAudioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(globalAudioCtx.destination);
        osc.start(globalAudioCtx.currentTime);
        osc.stop(globalAudioCtx.currentTime + dur);
      } catch(e) {
        console.warn('playChime warning:', e);
      }
    };

    // ==============================================================================
    // 1. PHÁT ÂM THANH MẪU CHUẨN BẢN XỨ (GOOGLE TTS + YOUDAO CDN + WEB SPEECH API)
    // ==============================================================================
    let persistentAudio = null;
    function getPersistentAudio() {
      if (!persistentAudio) {
        persistentAudio = document.getElementById('speakup_dom_audio');
        if (!persistentAudio) {
          persistentAudio = document.createElement('audio');
          persistentAudio.id = 'speakup_dom_audio';
          persistentAudio.style.display = 'none';
          document.body.appendChild(persistentAudio);
        }
      }
      return persistentAudio;
    }

    window.speakWord = function(text, lang) {
      if (!text) return;
      window.playChime(659.25, 0.1);
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.resume();
        }

        const encoded = encodeURIComponent(text.trim());
        const accentType = (lang === 'UK') ? '1' : '2';
        const googleUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encoded;
        const youdaoUrl = 'https://dict.youdao.com/dictvoice?audio=' + encoded + '&type=' + accentType;

        const audio = getPersistentAudio();
        audio.src = googleUrl;

        let played = false;
        const playFallback = function() {
          if (played) return;
          played = true;
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
              window.speechSynthesis.resume();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = (lang === 'UK') ? 'en-GB' : 'en-US';
              utterance.rate = 0.85;
              utterance.pitch = 1.0;
              window.speechSynthesis.speak(utterance);
              console.log('🔊 Web Speech Synthesis utterance:', text);
            } catch(e) {
              console.warn('TTS error:', e);
            }
          }
        };

        audio.onended = function() { played = true; };
        audio.onerror = function() {
          console.warn('Google TTS error, trying Youdao CDN...');
          audio.src = youdaoUrl;
          audio.play().then(function() {
            played = true;
          }).catch(function() {
            playFallback();
          });
        };

        const timer = setTimeout(function() {
          if (!played) playFallback();
        }, 1200);

        const p = audio.play();
        if (p !== undefined) {
          p.then(function() {
            clearTimeout(timer);
            played = true;
            console.log('✅ Âm thanh mẫu đã phát thành công:', text);
          }).catch(function(err) {
            clearTimeout(timer);
            playFallback();
          });
        }
      } catch (e) {
        console.error('Lỗi khi phát âm từ mẫu:', e);
      }
    };

    // ==============================================================================
    // 2. THU ÂM VÀ NHẬN DIỆN GIỌNG NÓI THỰC TẾ (WEB SPEECH RECOGNITION & MEDIARECORDER)
    // ==============================================================================
    let mediaStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let recordedAudioUrl = null;
    let currentMimeType = '';

    let recognition = null;
    window.lastRecognizedText = '';
    window.lastConfidence = 0.0;
    window.isSpeechRecActive = false;

    // Khởi tạo phiên SpeechRecognition mới mỗi lần bấm Micro (Tránh lỗi InvalidStateError)
    function createFreshRecognition(lang) {
      if (recognition) {
        try {
          recognition.abort();
        } catch(e) {}
        recognition = null;
      }

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        console.warn('Trình duyệt không hỗ trợ Web Speech Recognition');
        return null;
      }

      const rec = new SpeechRec();
      rec.continuous = true; // Giữ Micro mở liên tục kể cả khi người dùng tạm ngừng hơi
      rec.interimResults = true; // Bắt tức thời âm thanh theo thời gian thực
      rec.maxAlternatives = 3;
      rec.lang = (lang === 'UK') ? 'en-GB' : 'en-US';

      rec.onresult = function(event) {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const res = event.results[i];
          if (res && res[0] && res[0].transcript) {
            const rawText = res[0].transcript.trim().toLowerCase();
            if (rawText.length > 0) {
              window.lastRecognizedText = rawText;
              window.lastConfidence = (res[0].confidence && res[0].confidence > 0) ? res[0].confidence : 0.92;
              console.log('🎤 Web STT Realtime:', window.lastRecognizedText, 'Conf:', window.lastConfidence, 'isFinal:', res.isFinal);
            }
          }
        }
      };

      rec.onerror = function(event) {
        console.warn('Speech recognition warning/error:', event.error);
        if (event.error === 'not-allowed') {
          console.error('Quyền truy cập Microphone bị từ chối.');
        }
      };

      rec.onend = function() {
        window.isSpeechRecActive = false;
      };

      return rec;
    }

    window.startWebRecording = async function(lang) {
      window.lastRecognizedText = '';
      window.lastConfidence = 0.0;
      audioChunks = [];
      if (recordedAudioUrl) {
        URL.revokeObjectURL(recordedAudioUrl);
        recordedAudioUrl = null;
      }

      // 1. Khởi động nhận diện giọng nói STT
      try {
        recognition = createFreshRecognition(lang);
        if (recognition) {
          recognition.start();
          window.isSpeechRecActive = true;
          console.log('🎤 STT engine started in:', recognition.lang);
        }
      } catch (e) {
        console.warn('Lỗi start recognition:', e);
      }

      // 2. Khởi động thu âm tệp âm thanh thực tế từ Micro
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn('Trình duyệt không hỗ trợ getUserMedia');
          return;
        }

        if (mediaStream) {
          mediaStream.getTracks().forEach(function(track) {
            track.stop();
          });
          mediaStream = null;
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        
        currentMimeType = '';
        if (typeof MediaRecorder.isTypeSupported === 'function') {
          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            currentMimeType = 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/webm')) {
            currentMimeType = 'audio/webm';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            currentMimeType = 'audio/mp4';
          }
        }
        
        const options = currentMimeType ? { mimeType: currentMimeType } : undefined;
        mediaRecorder = new MediaRecorder(mediaStream, options);
        
        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };
        
        mediaRecorder.onstop = function() {
          try {
            if (audioChunks.length > 0) {
              const blobType = currentMimeType || 'audio/webm';
              audioBlob = new Blob(audioChunks, { type: blobType });
              recordedAudioUrl = URL.createObjectURL(audioBlob);
              console.log('✅ Đã lưu tệp giọng nói học viên:', audioBlob.size, 'bytes, URL:', recordedAudioUrl);
            }
          } catch(e) {
            console.error('Lỗi tạo audio blob:', e);
          }
        };

        // Ghi nhận khối dữ liệu mỗi 100ms
        mediaRecorder.start(100);
        console.log('🎤 MediaRecorder đang thu âm từ Micro...');
      } catch (err) {
        console.warn('Chưa cấp quyền Microphone hoặc không tìm thấy thiết bị thu:', err);
      }
    };

    window.stopWebRecording = function() {
      if (recognition) {
        try {
          recognition.stop();
        } catch (e) {}
      }
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        try {
          mediaRecorder.stop();
          console.log('🛑 Đã dừng thu âm');
        } catch (e) {
          console.error('Lỗi khi dừng thu âm:', e);
        }
      }
    };

    window.playRecordedAudio = function() {
      window.playChime(523.25, 0.12);
      try {
        if (recordedAudioUrl) {
          const audio = getPersistentAudio();
          audio.src = recordedAudioUrl;
          audio.play().then(function() {
            console.log('▶️ Đang phát lại giọng nói của bạn qua loa');
          }).catch(function(err) {
            console.error('Lỗi khi phát lại giọng:', err);
            speakLearnerFallback();
          });
        } else {
          speakLearnerFallback();
        }
      } catch (e) {
        console.error('Lỗi phát âm thanh:', e);
        speakLearnerFallback();
      }
    };

    function speakLearnerFallback() {
      if (window.lastRecognizedText && 'speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
          const utterance = new SpeechSynthesisUtterance(window.lastRecognizedText);
          utterance.lang = 'en-US';
          utterance.rate = 0.90;
          utterance.pitch = 0.85;
          window.speechSynthesis.speak(utterance);
          console.log('🔊 Phát lại từ nhận dạng bằng giọng học viên:', window.lastRecognizedText);
        } catch(e) {}
      }
    }

    window.stopRecordedAudio = function() {
      try {
        const audio = getPersistentAudio();
        audio.pause();
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      } catch(e) {}
    };

    window.hasRecordedAudio = function() {
      return (recordedAudioUrl !== null && audioChunks.length > 0);
    };

    window.clearLastRecognized = function() {
      window.lastRecognizedText = '';
      window.lastConfidence = 0.0;
    };

    window.getLastRecognizedText = function() {
      return window.lastRecognizedText || '';
    };

    window.getLastConfidence = function() {
      return window.lastConfidence || 0.0;
    };
  </script>
