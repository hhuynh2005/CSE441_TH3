<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ứng dụng luyện phát âm tiếng Anh AI và theo dõi kỷ luật học tập - Bài tập thực hành 3 (TH3) Nhóm 16">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SpeakUp AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts for Material Icons and Noto Sans IPA Support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">

  <title>SpeakUp AI - TH3 Nhóm 16</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // ==============================================================================
    // 1. PHÁT ÂM THANH MẪU CHUẨN NGƯỜI BẢN XỨ (WEB SPEECH SYNTHESIS TTS)
    // ==============================================================================
    window.speakWord = function(text, lang) {
      if (!('speechSynthesis' in window)) {
        console.warn('Trình duyệt không hỗ trợ Web Speech Synthesis API');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = (lang === 'UK') ? 'en-GB' : 'en-US';
        utterance.rate = 0.85; // Tốc độ chuẩn cho học viên luyện nghe
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
        console.log('Speaking word:', text, 'with accent:', utterance.lang);
      } catch (e) {
        console.error('Lỗi khi phát âm từ mẫu:', e);
      }
    };

    // ==============================================================================
    // 2. THU ÂM VÀ PHÁT LẠI GIỌNG NÓI HỌC VIÊN QUA WEB MEDIARECORDER API
    // ==============================================================================
    let mediaStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let recordedAudioUrl = null;
    let currentPlaybackAudio = null;

    window.startWebRecording = async function() {
      audioChunks = [];
      if (currentPlaybackAudio) {
        currentPlaybackAudio.pause();
        currentPlaybackAudio = null;
      }
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn('Trình duyệt không hỗ trợ truy cập Microphone');
          return;
        }
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        let mimeType = 'audio/webm';
        if (typeof MediaRecorder.isTypeSupported === 'function') {
          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            mimeType = 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4';
          }
        }
        
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: mimeType });
        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };
        
        mediaRecorder.onstop = function() {
          if (audioChunks.length > 0) {
            audioBlob = new Blob(audioChunks, { type: mimeType });
            if (recordedAudioUrl) {
              URL.revokeObjectURL(recordedAudioUrl);
            }
            recordedAudioUrl = URL.createObjectURL(audioBlob);
            console.log('✅ Thu âm hoàn tất, kích thước:', audioBlob.size, 'bytes, URL:', recordedAudioUrl);
          }
          if (mediaStream) {
            mediaStream.getTracks().forEach(function(track) {
              track.stop();
            });
            mediaStream = null;
          }
        };

        // Thu thập dữ liệu âm thanh mỗi 200ms
        mediaRecorder.start(200);
        console.log('🎤 Bắt đầu thu âm từ Microphone...');
      } catch (err) {
        console.warn('Microphone không sẵn sàng hoặc chưa cấp quyền:', err);
      }
    };

    window.stopWebRecording = function() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        try {
          mediaRecorder.stop();
          console.log('🛑 Đã dừng thu âm');
        } catch (e) {
          console.error('Lỗi khi dừng thu âm:', e);
        }
      }
    };

    window.playRecordedAudio = function() {
      try {
        if (currentPlaybackAudio) {
          currentPlaybackAudio.pause();
          currentPlaybackAudio = null;
        }
        if (recordedAudioUrl) {
          currentPlaybackAudio = new Audio(recordedAudioUrl);
          currentPlaybackAudio.play().then(function() {
            console.log('▶️ Đang phát lại giọng thu của học viên');
          }).catch(function(err) {
            console.error('Lỗi phát âm thanh:', err);
          });
        } else {
          console.warn('Chưa có tệp thu âm hợp lệ. Đang dùng phản hồi âm mẫu.');
        }
      } catch (e) {
        console.error('Lỗi khi phát lại giọng:', e);
      }
    };

    window.stopRecordedAudio = function() {
      if (currentPlaybackAudio) {
        currentPlaybackAudio.pause();
        currentPlaybackAudio = null;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
